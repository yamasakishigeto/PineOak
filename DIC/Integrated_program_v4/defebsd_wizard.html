<!DOCTYPE html>
<!-- v2 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Def EBSD Georef Wizard</title>
<script src="/eel.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500&display=swap');

  :root {
    --bg: #0a0c0f;
    --surface: #111318;
    --surface2: #1a1d24;
    --border: #2a2d35;
    --accent: #00d4ff;
    --accent2: #ff6b35;
    --green: #00ff88;
    --red: #ff4444;
    --text: #e0e4ec;
    --text-dim: #6b7280;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Noto Sans JP', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-weight: 300;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  .logo { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase; }
  .logo span { color: var(--text-dim); font-weight: 400; }
  .subtitle { font-size: 11px; color: var(--text-dim); font-family: var(--mono); }

  .main {
    flex: 1;
    overflow-y: auto;
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ---- カード ---- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .card-title {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    padding: 12px 16px 0;
    margin-bottom: 10px;
  }

  /* ---- ファイル行 ---- */
  .file-rows { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 8px; }
  .file-row  { display: flex; align-items: center; gap: 8px; }
  .file-label {
    font-family: var(--mono); font-size: 11px; color: var(--text-dim);
    width: 160px; flex-shrink: 0;
  }
  .file-label .required { color: var(--accent2); margin-left: 2px; }
  .file-path {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 3px; padding: 5px 10px; font-family: var(--mono);
    font-size: 10px; color: var(--text-dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: default;
  }
  .file-path.set  { color: var(--text); border-color: rgba(0,212,255,0.3); }

  .btn-sm {
    padding: 5px 12px; border: 1px solid var(--border); background: var(--surface2);
    color: var(--text); font-family: var(--mono); font-size: 11px;
    cursor: pointer; border-radius: 3px; transition: all 0.15s; white-space: nowrap; flex-shrink: 0;
  }
  .btn-sm:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,0.07); }
  .btn-sm:disabled { opacity: 0.35; cursor: not-allowed; }

  /* ---- モード切替 ---- */
  .mode-row {
    padding: 0 16px 12px;
    display: flex;
    gap: 6px;
  }
  .btn-mode {
    padding: 5px 18px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 11px;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-mode.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,212,255,0.10);
  }
  .btn-mode:hover:not(.active) {
    border-color: var(--text-dim);
    color: var(--text);
  }

  /* ---- ステージヘッダー ---- */
  .stages-header {
    padding: 0 16px 8px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
  .stages-title {
    font-family: var(--mono); font-size: 10px; color: var(--accent);
    text-transform: uppercase; letter-spacing: 0.12em; flex: 1;
  }
  .stages-hint {
    font-family: var(--mono); font-size: 10px; color: var(--text-dim);
  }

  /* ---- チェックボックスリスト ---- */
  .stages-list {
    padding: 0 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 420px;
    overflow-y: auto;
  }

  .stage-row {
    display: grid;
    grid-template-columns: 22px 140px 1fr auto 70px;
    gap: 8px;
    align-items: center;
    padding: 6px 8px;
    border: 1px solid transparent;
    border-radius: 4px;
    transition: border-color 0.2s, background 0.2s;
  }
  .stage-row:hover { background: rgba(255,255,255,0.02); }
  .stage-row.running { border-color: var(--accent);  background: rgba(0,212,255,0.04); }
  .stage-row.done    { border-color: var(--green);   background: rgba(0,255,136,0.03); }
  .stage-row.error   { border-color: var(--accent2); background: rgba(255,107,53,0.04); }
  .stage-row.unchecked { opacity: 0.38; }

  .stage-check {
    width: 14px; height: 14px; cursor: pointer;
    accent-color: var(--accent);
  }

  .stage-label-text {
    font-family: var(--mono); font-size: 11px; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .stage-path-text {
    font-family: var(--mono); font-size: 10px; color: var(--text-dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 3px; padding: 4px 8px; cursor: default;
  }
  .stage-path-text.set { color: var(--text); border-color: rgba(0,212,255,0.25); }
  .stage-path-text.missing { border-color: rgba(255,107,53,0.4); color: var(--accent2); }

  .stage-status {
    font-family: var(--mono); font-size: 9px; text-align: center;
    padding: 2px 6px; border-radius: 3px; white-space: nowrap;
    color: var(--text-dim);
  }
  .stage-status.running { color: var(--accent);  background: rgba(0,212,255,0.12); }
  .stage-status.done    { color: var(--green);   background: rgba(0,255,136,0.10); }
  .stage-status.error   { color: var(--accent2); background: rgba(255,107,53,0.10); }

  .empty-hint {
    font-size: 11px; color: var(--text-dim); text-align: center;
    padding: 14px 0; font-style: italic;
  }

  /* ---- フッター ---- */
  footer {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .btn-run {
    padding: 9px 28px; border: 1px solid var(--accent);
    background: rgba(0,212,255,0.1); color: var(--accent);
    font-family: var(--mono); font-size: 13px; font-weight: 700;
    cursor: pointer; border-radius: 4px; transition: all 0.15s; letter-spacing: 0.08em;
  }
  .btn-run:hover:not(:disabled) { background: rgba(0,212,255,0.2); }
  .btn-run:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-cancel {
    padding: 9px 18px; border: 1px solid var(--border); background: transparent;
    color: var(--text-dim); font-family: var(--mono); font-size: 12px;
    cursor: pointer; border-radius: 4px; transition: all 0.15s;
  }
  .btn-cancel:hover { border-color: var(--accent2); color: var(--accent2); }
  .footer-status {
    flex: 1; font-family: var(--mono); font-size: 11px;
    color: var(--text-dim); text-align: right;
  }
  .footer-status.ok  { color: var(--green); }
  .footer-status.err { color: var(--accent2); }
</style>
</head>
<body>

<header>
  <div class="logo">DIC<span>-</span>Suite</div>
  <div class="subtitle">Def EBSD Georef Wizard</div>
</header>

<div class="main">

  <!-- Step 1: 入力ファイル -->
  <div class="card">
    <div class="card-title">Step 1 — 入力ファイル</div>
    <div class="file-rows">
      <div class="file-row">
        <div class="file-label">dic_results_georef.xlsx<span class="required">*</span></div>
        <div class="file-path" id="georef-path">（未選択）</div>
        <button class="btn-sm" onclick="browseGeoref()">選択…</button>
      </div>
      <div class="file-row">
        <div class="file-label">出力フォルダ<span class="required">*</span></div>
        <div class="file-path" id="out-path">（未選択、自動設定）</div>
        <button class="btn-sm" onclick="browseOut()">変更…</button>
      </div>
    </div>
  </div>

  <!-- Step 2: EBSDデータ形式 + 変形段階 -->
  <div class="card">
    <div class="card-title">Step 2 — EBSDデータ形式と変形段階</div>

    <!-- モード切替（全段階共通） -->
    <div class="mode-row">
      <button class="btn-mode active" id="btn-mode-mat"   onclick="setMode('mat')"  >.mat (CrossCourt)　HR-EBSD</button>
      <button class="btn-mode"        id="btn-mode-grain" onclick="setMode('grain')">Grain File (.txt)　Normal EBSD</button>
    </div>

    <!-- 変形段階リストヘッダー -->
    <div class="stages-header">
      <div class="stages-title">変形段階チェックリスト</div>
      <span class="stages-hint" id="stages-hint"></span>
      <button class="btn-sm" id="btn-bulk" onclick="browseFiles()" disabled>一括選択…</button>
    </div>

    <div class="stages-list" id="stages-list">
      <div class="empty-hint" id="empty-hint">georef.xlsx を選択すると変形段階が表示されます</div>
    </div>
  </div>

</div>

<footer>
  <button class="btn-run" id="btn-run" onclick="onRun()" disabled>実行</button>
  <button class="btn-cancel" onclick="window.close()">キャンセル</button>
  <div class="footer-status" id="footer-status"></div>
</footer>

<script>
  let _georefPath = null;
  let _outPath    = null;
  let _mode       = 'mat';      // グローバルモード
  let _labels     = [];         // georef.xlsx から取得したラベル
  // _stageState[label] = { checked: bool, path: string|null, status: 'idle'|'running'|'done'|'error' }
  const _stageState = {};
  let _running = false;

  // ── モード切替 ───────────────────────────────────────────────────────────
  function setMode(mode) {
    _mode = mode;
    document.getElementById('btn-mode-mat').classList.toggle('active',   mode === 'mat');
    document.getElementById('btn-mode-grain').classList.toggle('active', mode === 'grain');
    // ファイルパスをリセット（形式が変わるので）
    _labels.forEach(lbl => {
      _stageState[lbl].path = null;
      const el = document.getElementById(`stage-path-${_safeId(lbl)}`);
      if (el) { el.textContent = '（未選択）'; el.className = 'stage-path-text'; }
    });
    updateHint();
    updateRunButton();
  }

  // ── georef.xlsx 選択 ──────────────────────────────────────────────────────
  async function browseGeoref() {
    const wd = window._workDir || '';
    const path = await eel.defebsd_browse_file(
      'dic_results_georef.xlsx を選択',
      [['Excel files', '*.xlsx'], ['All files', '*.*']], wd)();
    if (!path) return;

    _georefPath = path;
    document.getElementById('georef-path').textContent = path;
    document.getElementById('georef-path').classList.add('set');

    // 出力フォルダの自動設定
    if (!_outPath) {
      const dir = path.replace(/[/\\][^/\\]+$/, '');
      _outPath = dir + '/defebsd_georef';
      document.getElementById('out-path').textContent = _outPath;
      document.getElementById('out-path').classList.add('set');
    }

    // ラベル読み込み → チェックリスト生成
    setStatus('ラベルを読み込み中...', true);
    try {
      _labels = await eel.defebsd_get_labels(path)();
      buildChecklist();
      setStatus(`${_labels.length} 段階を読み込みました`, true);
    } catch(e) {
      setStatus('ラベルの読み込みに失敗しました', false);
    }
    updateRunButton();
  }

  // ── 出力フォルダ選択 ─────────────────────────────────────────────────────
  async function browseOut() {
    const wd = window._workDir || '';
    const path = await eel.defebsd_browse_dir('出力フォルダを選択', wd)();
    if (!path) return;
    _outPath = path;
    document.getElementById('out-path').textContent = path;
    document.getElementById('out-path').classList.add('set');
  }

  // ── チェックリスト生成 ───────────────────────────────────────────────────
  function buildChecklist() {
    // stateを初期化（既存は保持）
    _labels.forEach(lbl => {
      if (!_stageState[lbl]) _stageState[lbl] = { checked: true, path: null, status: 'idle' };
    });

    const list = document.getElementById('stages-list');
    list.innerHTML = '';

    if (_labels.length === 0) {
      list.innerHTML = '<div class="empty-hint">変形段階が見つかりませんでした</div>';
      document.getElementById('btn-bulk').disabled = true;
      return;
    }

    document.getElementById('btn-bulk').disabled = false;

    _labels.forEach(lbl => {
      const sid = _safeId(lbl);
      const st  = _stageState[lbl];

      const row = document.createElement('div');
      row.className = 'stage-row' + (st.checked ? '' : ' unchecked');
      row.id = `stage-row-${sid}`;

      // チェックボックス
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'stage-check';
      cb.checked = st.checked;
      cb.onchange = () => {
        _stageState[lbl].checked = cb.checked;
        row.classList.toggle('unchecked', !cb.checked);
        updateHint();
        updateRunButton();
      };

      // ラベル名
      const labelEl = document.createElement('div');
      labelEl.className = 'stage-label-text';
      labelEl.textContent = lbl;
      labelEl.title = lbl;

      // ファイルパス表示
      const pathEl = document.createElement('div');
      pathEl.className = 'stage-path-text' + (st.path ? ' set' : '');
      pathEl.id = `stage-path-${sid}`;
      pathEl.textContent = st.path ? _basename(st.path) : '（未選択）';
      pathEl.title = st.path || '';

      // 個別選択ボタン
      const browseBtn = document.createElement('button');
      browseBtn.className = 'btn-sm';
      browseBtn.textContent = '選択…';
      browseBtn.onclick = () => browseFileSingle(lbl);

      // ステータスバッジ
      const statEl = document.createElement('div');
      statEl.className = 'stage-status ' + (st.status === 'idle' ? '' : st.status);
      statEl.id = `stage-status-${sid}`;
      statEl.textContent = st.status === 'idle' ? '—' :
                           st.status === 'running' ? 'RUNNING' :
                           st.status === 'done'    ? 'DONE'    : 'ERROR';

      row.appendChild(cb);
      row.appendChild(labelEl);
      row.appendChild(pathEl);
      row.appendChild(browseBtn);
      row.appendChild(statEl);
      list.appendChild(row);
    });

    updateHint();
  }

  // ── 一括ファイル選択 ─────────────────────────────────────────────────────
  async function browseFiles() {
    const wd = window._workDir || '';
    let title, filetypes;
    if (_mode === 'mat') {
      title     = 'EBSD .mat ファイルを一括選択（チェック済み段階の数だけ選択）';
      filetypes = [['MATLAB file', '*.mat'], ['All files', '*.*']];
    } else {
      title     = 'Grain File を一括選択（チェック済み段階の数だけ選択）';
      filetypes = [['Grain File', '*.txt'], ['All files', '*.*']];
    }

    const paths = await eel.defebsd_browse_files(title, filetypes, wd)();
    if (!paths || paths.length === 0) return;

    // チェック済みラベルに順番に割り当て
    const checkedLabels = _labels.filter(lbl => _stageState[lbl].checked);
    paths.forEach((p, i) => {
      if (i >= checkedLabels.length) return;
      const lbl = checkedLabels[i];
      _stageState[lbl].path = p;
      const sid = _safeId(lbl);
      const el  = document.getElementById(`stage-path-${sid}`);
      if (el) {
        el.textContent = _basename(p);
        el.title = p;
        el.className = 'stage-path-text set';
      }
    });

    const n = Math.min(paths.length, checkedLabels.length);
    setStatus(`${n} 件のファイルを割り当てました`, true);
    updateRunButton();
  }

  // ── 個別ファイル選択 ─────────────────────────────────────────────────────
  async function browseFileSingle(lbl) {
    const wd = window._workDir || '';
    let title, filetypes;
    if (_mode === 'mat') {
      title     = `${lbl} — .mat ファイルを選択`;
      filetypes = [['MATLAB file', '*.mat'], ['All files', '*.*']];
    } else {
      title     = `${lbl} — Grain File を選択`;
      filetypes = [['Grain File', '*.txt'], ['All files', '*.*']];
    }
    const path = await eel.defebsd_browse_file(title, filetypes, wd)();
    if (!path) return;

    _stageState[lbl].path = path;
    const sid = _safeId(lbl);
    const el  = document.getElementById(`stage-path-${sid}`);
    if (el) {
      el.textContent = _basename(path);
      el.title = path;
      el.className = 'stage-path-text set';
    }
    updateRunButton();
  }

  // ── ヒント更新 ───────────────────────────────────────────────────────────
  function updateHint() {
    const checked = _labels.filter(lbl => _stageState[lbl].checked).length;
    document.getElementById('stages-hint').textContent =
      _labels.length > 0 ? `${checked} / ${_labels.length} 段階を選択中` : '';
  }

  // ── 実行ボタン有効/無効 ──────────────────────────────────────────────────
  function updateRunButton() {
    const checkedLabels = _labels.filter(lbl => _stageState[lbl].checked);
    const allHaveFiles  = checkedLabels.length > 0
      && checkedLabels.every(lbl => _stageState[lbl].path);
    const ok = _georefPath && _outPath && allHaveFiles && !_running;
    document.getElementById('btn-run').disabled = !ok;
  }

  // ── 実行 ─────────────────────────────────────────────────────────────────
  async function onRun() {
    const checkedLabels = _labels.filter(lbl => _stageState[lbl].checked);
    if (!_georefPath)             { setStatus('georef.xlsx を選択してください', false); return; }
    if (checkedLabels.length===0) { setStatus('1段階以上チェックしてください', false); return; }
    if (checkedLabels.some(lbl => !_stageState[lbl].path)) {
      setStatus('チェック済み段階すべてにファイルを割り当ててください', false); return;
    }

    _running = true;
    document.getElementById('btn-run').disabled = true;
    document.getElementById('btn-bulk').disabled = true;
    setStatus('解析を開始しています...', true);

    const params = {
      georef_xlsx: _georefPath,
      out_dir:     _outPath,
      stages: checkedLabels.map(lbl => ({
        label:     lbl,
        ebsd_path: _stageState[lbl].path,
        mode:      _mode,
      })),
    };

    await eel.defebsd_start_batch(params)();
  }

  // ── Python コールバック ──────────────────────────────────────────────────
  eel.expose(defebsd_on_stage_status);
  function defebsd_on_stage_status(label, msg, type) {
    if (!_stageState[label]) return;
    _stageState[label].status = type === 'ok' ? 'running' : type === 'done' ? 'done' : 'error';
    const sid  = _safeId(label);
    const row  = document.getElementById(`stage-row-${sid}`);
    const stat = document.getElementById(`stage-status-${sid}`);
    if (row) {
      row.className = 'stage-row ' +
        (type === 'ok' ? 'running' : type === 'done' ? 'done' : 'error');
    }
    if (stat) {
      stat.className = 'stage-status ' +
        (type === 'ok' ? 'running' : type === 'done' ? 'done' : 'error');
      stat.textContent = type === 'ok' ? 'RUNNING' : type === 'done' ? 'DONE' : 'ERROR';
    }
  }

  eel.expose(defebsd_on_complete);
  function defebsd_on_complete(success, msg) {
    _running = false;
    setStatus(msg, success);
    document.getElementById('btn-bulk').disabled = false;
    updateRunButton();
  }

  // ── ユーティリティ ───────────────────────────────────────────────────────
  function setStatus(msg, ok) {
    const el = document.getElementById('footer-status');
    el.textContent = msg;
    el.className = 'footer-status ' + (ok ? 'ok' : 'err');
  }

  function _basename(p) {
    return p.replace(/.*[/\\]/, '');
  }

  function _safeId(lbl) {
    // ラベルを DOM ID に使えるよう英数字・ハイフン以外を置換
    return lbl.replace(/[^a-zA-Z0-9\-]/g, '_');
  }

  window.addEventListener('load', async () => {
    const workDir = await eel.get_work_dir()();
    if (workDir) window._workDir = workDir;
  });
</script>
</body>
</html>
