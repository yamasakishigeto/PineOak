<!DOCTYPE html>
<!-- v3 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EBSD PatRep Wizard</title>
<script src="/eel.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500&display=swap');

  :root {
    --bg: #0a0c0f;
    --surface: #111318;
    --surface2: #1a1d24;
    --border: #2a2d35;
    --accent: #00d4ff;
    --accent2: #ff6b35;
    --green: #00ff88;
    --text: #e0e4ec;
    --text-dim: #6b7280;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Noto Sans JP', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-weight: 300;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  .logo { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase; }
  .logo span { color: var(--text-dim); font-weight: 400; }
  .subtitle { font-size: 11px; color: var(--text-dim); font-family: var(--mono); }

  .main {
    flex: 1;
    overflow-y: auto;
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ---- カード ---- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .card-title {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    padding: 12px 16px 8px;
  }

  /* ---- ファイル行 ---- */
  .file-rows { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 8px; }
  .file-row  { display: flex; align-items: center; gap: 8px; }
  .file-label {
    font-family: var(--mono); font-size: 11px; color: var(--text-dim);
    width: 140px; flex-shrink: 0;
  }
  .required { color: var(--accent2); margin-left: 2px; }
  .file-path {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 3px; padding: 5px 10px; font-family: var(--mono);
    font-size: 10px; color: var(--text-dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: default;
  }
  .file-path.set { color: var(--text); border-color: rgba(0,212,255,0.3); }

  .btn-sm {
    padding: 5px 12px; border: 1px solid var(--border); background: var(--surface2);
    color: var(--text); font-family: var(--mono); font-size: 11px;
    cursor: pointer; border-radius: 3px; transition: all 0.15s; white-space: nowrap; flex-shrink: 0;
  }
  .btn-sm:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,0.07); }
  .btn-sm:disabled { opacity: 0.35; cursor: not-allowed; }

  /* ---- パラメータ行 ---- */
  .param-rows { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 10px; }
  .param-row  { display: flex; align-items: center; gap: 10px; }
  .param-label {
    font-family: var(--mono); font-size: 11px; color: var(--text-dim);
    width: 200px; flex-shrink: 0;
  }
  .param-input {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 3px; padding: 5px 10px; font-family: var(--mono);
    font-size: 11px; color: var(--text); width: 120px;
  }
  .param-input:focus { outline: none; border-color: var(--accent); }
  .param-unit { font-family: var(--mono); font-size: 10px; color: var(--text-dim); }

  /* ---- Phase 対称性 ---- */
  .phase-rows { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 8px; }
  .phase-row  { display: flex; align-items: center; gap: 10px; }
  .phase-label {
    font-family: var(--mono); font-size: 11px; color: var(--text);
    width: 180px; flex-shrink: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sym-select {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 3px; padding: 5px 8px; font-family: var(--mono);
    font-size: 11px; color: var(--text); cursor: pointer; flex: 1;
  }
  .sym-select:focus { outline: none; border-color: var(--accent); }

  .nth-hint { font-size: 11px; color: var(--text-dim); text-align: center; padding: 12px 0; font-style: italic; }
  .nth-header { padding: 0 16px 6px; display: flex; align-items: center; gap: 8px; }
  .nth-header-title { font-family: var(--mono); font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.12em; flex: 1; }
  .nth-header-hint  { font-family: var(--mono); font-size: 10px; color: var(--text-dim); }

  /* ---- フッター ---- */
  footer {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  .btn-run {
    padding: 9px 28px; border: 1px solid var(--accent);
    background: rgba(0,212,255,0.1); color: var(--accent);
    font-family: var(--mono); font-size: 13px; font-weight: 700;
    cursor: pointer; border-radius: 4px; transition: all 0.15s; letter-spacing: 0.08em;
  }
  .btn-run:hover:not(:disabled) { background: rgba(0,212,255,0.2); }
  .btn-run:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-cancel {
    padding: 9px 18px; border: 1px solid var(--border); background: transparent;
    color: var(--text-dim); font-family: var(--mono); font-size: 12px;
    cursor: pointer; border-radius: 4px; transition: all 0.15s;
  }
  .btn-cancel:hover { border-color: var(--accent2); color: var(--accent2); }
  .footer-status {
    flex: 1; font-family: var(--mono); font-size: 11px; color: var(--text-dim); text-align: right;
  }
  .footer-status.ok  { color: var(--green); }
  .footer-status.err { color: var(--accent2); }

  /* ---- ステージテーブル ---- */
  .stage-wrap {
    padding: 0 16px 14px;
    max-height: 380px;
    overflow-y: auto;
  }
  .stage-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11px; }
  .stage-table thead th {
    position: sticky; top: 0; background: var(--surface); z-index: 1;
    color: var(--text-dim); font-weight: 400; padding: 4px 8px;
    border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap;
  }
  .stage-table th.col-center { text-align: center; }
  .stage-table td { padding: 4px 6px; border-bottom: 1px solid rgba(255,255,255,0.03); }
  .stage-table td.col-center { text-align: center; }
  .stage-row { transition: background 0.15s; }
  .stage-row:hover { background: rgba(255,255,255,0.02); }
  .stage-row.is-ref { background: rgba(0,212,255,0.05); }
  .stage-row.running { background: rgba(0,212,255,0.04); }
  .stage-row.done    { background: rgba(0,255,136,0.03); }
  .stage-row.error   { background: rgba(255,107,53,0.04); }
  .stage-row.unchecked td { opacity: 0.38; }
  .stage-name { font-family: var(--mono); font-size: 11px; color: var(--text); white-space: nowrap; }
  .file-col   { font-family: var(--mono); font-size: 10px; color: var(--text-dim); }

  /* ファイル選択ドロップダウン */
  .file-select {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 3px; padding: 2px 4px; font-family: var(--mono);
    font-size: 10px; color: var(--text); cursor: pointer;
    max-width: 200px; width: 100%;
  }
  .file-select:focus { outline: none; border-color: var(--accent); }
  .file-select.ng { color: var(--text-dim); opacity: 0.6; }
  .file-col-dash { font-family: var(--mono); font-size: 10px; color: var(--text-dim); opacity: 0.5; }
</style>
</head>
<body>

<header>
  <div class="logo">DIC<span>-</span>Suite</div>
  <div class="subtitle">EBSD PatRep Wizard</div>
</header>

<div class="main">

  <!-- Step 1: 親フォルダ -->
  <div class="card">
    <div class="card-title">Step 1 — 親フォルダ（pre-processed *.mat を含むフォルダ）</div>
    <div class="file-rows">
      <div class="file-row">
        <div class="file-label">親フォルダ<span class="required">*</span></div>
        <div class="file-path" id="parent-path">（未選択）</div>
        <button class="btn-sm" onclick="browseParent()">選択…</button>
      </div>
    </div>
  </div>

  <!-- Step 2: ステージ一覧 -->
  <div class="card">
    <div class="nth-header">
      <div class="nth-header-title">Step 2 — ステージ一覧</div>
      <span class="nth-header-hint" id="nth-hint"></span>
    </div>
    <div class="stage-wrap" id="stage-wrap">
      <div class="nth-hint">親フォルダを選択すると自動検出されます</div>
    </div>
  </div>

  <!-- Step 3: パラメータ -->
  <div class="card">
    <div class="card-title">Step 3 — パラメータ</div>
    <div class="param-rows">
      <div class="param-row">
        <div class="param-label">Misorientation 閾値</div>
        <input class="param-input" type="number" id="angle-thr" value="5.0" min="0" step="0.5">
        <span class="param-unit">deg</span>
      </div>
      <div class="param-row">
        <div class="param-label">Scale factor（tif ファイル名）</div>
        <input class="param-input" type="number" id="scale-factor" value="100" min="1" step="1">
        <span class="param-unit">（例: step=0.1μm, factor=100 → x10y20.tif）</span>
      </div>
    </div>
  </div>

  <!-- Step 4: Phase 別対称性 -->
  <div class="card">
    <div class="card-title">Step 4 — Phase 別 結晶対称性</div>
    <div class="phase-rows" id="phase-rows">
      <div class="nth-hint">親フォルダを選択すると Phase が自動検出されます</div>
    </div>
  </div>

</div>

<footer>
  <button class="btn-run" id="btn-run" onclick="onRun()" disabled>実行</button>
  <button class="btn-cancel" onclick="window.close()">キャンセル</button>
  <div class="footer-status" id="footer-status"></div>
</footer>

<script>
  const SYM_OPTIONS = [
    ['cubic',        'Cubic（立方晶）'],
    ['hexagonal',    'Hexagonal（六方晶）'],
    ['tetragonal',   'Tetragonal（正方晶）'],
    ['orthorhombic', 'Orthorhombic（斜方晶）'],
    ['trigonal',     'Trigonal（三方晶）'],
    ['monoclinic',   'Monoclinic（単斜晶）'],
    ['triclinic',    'Triclinic（三斜晶）'],
  ];

  let _parentFolder = null;
  let _stages       = [];   // [{name, has_mat, has_xlsx, has_tif, tif_name}]
  let _allTifDirs   = [];   // 親フォルダ内の全サブフォルダ名
  let _phases       = [];   // [{index, name}]
  let _running      = false;

  // ── 親フォルダ選択 ──────────────────────────────────────────────────────────
  async function browseParent() {
    const wd = window._workDir || '';
    const path = await eel.patrep_browse_dir('親フォルダを選択（pre-processed *.mat を含むフォルダ）', wd)();
    if (!path) return;

    _parentFolder = path;
    const el = document.getElementById('parent-path');
    el.textContent = path;
    el.classList.add('set');

    setStatus('フォルダ情報を読み込み中...', true);
    try {
      const info = await eel.patrep_get_info(path)();
      if (info.error) { setStatus(info.error, false); return; }

      _stages     = info.stages      || [];
      _allTifDirs = info.all_tif_dirs || [];
      _phases     = info.phases;

      buildStageTable();
      buildPhaseRows();
      const nthCount = document.querySelectorAll('.nth-check:not(:disabled)').length;
      setStatus(`${nthCount} 段階・${_phases.length} Phase を検出しました`, true);
    } catch(e) {
      setStatus('フォルダ情報の読み込みに失敗しました', false);
    }
    updateRunButton();
  }

  // ── ステージ名の表示用ラベル（末尾の序数接尾辞を除去）──────────────────────
  function stageLabel(name) {
    return name.replace(/(?:th|st|nd|rd)$/i, '');
  }

  // ── ファイル選択ドロップダウン生成 ─────────────────────────────────────────
  function makeFileSelect(options, defaultVal, labelFn, cls) {
    const sel = document.createElement('select');
    sel.className = `file-select ${cls}`;
    if (!options.includes(defaultVal)) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = '—';
      opt.selected = true;
      sel.appendChild(opt);
      sel.classList.add('ng');
    }
    options.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = labelFn(v);
      opt.selected = v === defaultVal;
      sel.appendChild(opt);
    });
    return sel;
  }

  function makeTifSelect(dirs, defaultDir, cls) {
    const sel = document.createElement('select');
    sel.className = `file-select ${cls}`;
    const blankOpt = document.createElement('option');
    blankOpt.value = '';
    blankOpt.textContent = '—';
    blankOpt.selected = !defaultDir;
    sel.appendChild(blankOpt);
    dirs.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = d;
      opt.selected = d === defaultDir;
      sel.appendChild(opt);
    });
    if (!defaultDir) sel.classList.add('ng');
    return sel;
  }

  // ── ステージテーブル構築 ─────────────────────────────────────────────────────
  function buildStageTable() {
    const wrap = document.getElementById('stage-wrap');
    wrap.innerHTML = '';

    const sorted = [..._stages].sort((a, b) =>
      a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

    if (sorted.length === 0) {
      wrap.innerHTML = '<div class="nth-hint">対応する pre-processed .mat が見つかりませんでした</div>';
      return;
    }

    const allMats  = sorted.filter(s => s.has_mat).map(s => s.name);
    const allXlsx  = sorted.filter(s => s.has_xlsx).map(s => s.name);

    const table = document.createElement('table');
    table.className = 'stage-table';
    table.innerHTML = `<thead><tr>
      <th>変形ステージ</th>
      <th>matファイル</th>
      <th>tifフォルダ</th>
      <th>xlsxファイル</th>
      <th class="col-center">参照</th>
      <th class="col-center">処理対象</th>
    </tr></thead>`;

    const tbody = document.createElement('tbody');
    sorted.forEach((stage, i) => {
      const { name, has_mat, has_tif, has_xlsx, tif_name, xlsx_name } = stage;
      const sid    = _sid(name);
      const isRef  = i === 0;
      const canNth = has_mat && has_xlsx;

      const tr = document.createElement('tr');
      tr.className = 'stage-row' + (isRef ? ' is-ref' : (!canNth ? ' unchecked' : ''));
      tr.id = `nth-row-${sid}`;

      // 変形ステージ名（序数接尾辞を除去して表示）
      const tdName = document.createElement('td');
      tdName.className = 'stage-name';
      tdName.textContent = stageLabel(name);
      tdName.title = name;

      // Mat ドロップダウン
      const tdMat = document.createElement('td');
      tdMat.className = 'file-col';
      tdMat.appendChild(makeFileSelect(allMats, name, n => `pre-processed ${n}.mat`, 'mat-select'));

      // Tif ドロップダウン
      const tdTif = document.createElement('td');
      tdTif.className = 'file-col';
      tdTif.appendChild(makeTifSelect(_allTifDirs, tif_name || '', 'tif-select'));

      // Xlsx ドロップダウン（ref 行は "—" を表示するだけ）
      const tdXlsx = document.createElement('td');
      tdXlsx.className = 'file-col';
      if (isRef) {
        const dash = document.createElement('span');
        dash.className = 'file-col-dash';
        dash.textContent = '—';
        tdXlsx.appendChild(dash);
      } else {
        tdXlsx.appendChild(makeFileSelect(allXlsx, xlsx_name || '', n => `pre-processed ${n}.xlsx`, 'xlsx-select'));
      }

      // 参照ラジオ（mat があれば選べる）
      const tdRadio = document.createElement('td');
      tdRadio.className = 'col-center';
      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'stage-role';
      radio.value = name;
      radio.checked = isRef;
      radio.disabled = !has_mat;
      radio.style.accentColor = 'var(--accent)';
      radio.onchange = onStageChange;
      tdRadio.appendChild(radio);

      // 処理対象チェック（mat + xlsx があれば選べる）
      const tdCheck = document.createElement('td');
      tdCheck.className = 'col-center';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'nth-check';
      cb.value = name;
      cb.checked = !isRef && canNth;
      cb.disabled = isRef || !canNth;
      cb.style.accentColor = 'var(--accent)';
      cb.style.visibility = isRef ? 'hidden' : '';
      cb.onchange = () => {
        tr.classList.toggle('unchecked', !cb.checked);
        updateHint();
        updateRunButton();
      };
      tdCheck.appendChild(cb);

      tr.append(tdName, tdMat, tdTif, tdXlsx, tdRadio, tdCheck);
      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    wrap.appendChild(table);
    updateHint();
  }

  // ── 参照ラジオ変更時 ─────────────────────────────────────────────────────────
  function onStageChange() {
    const refRadio = document.querySelector('input[name="stage-role"]:checked');
    const refName  = refRadio ? refRadio.value : '';
    document.querySelectorAll('.stage-row').forEach(tr => {
      const radio = tr.querySelector('input[name="stage-role"]');
      const cb    = tr.querySelector('.nth-check');
      const isRef = radio && radio.value === refName;
      tr.classList.toggle('is-ref', isRef);
      tr.classList.toggle('unchecked', !isRef && cb && !cb.checked);
      if (cb) { cb.disabled = isRef; cb.style.visibility = isRef ? 'hidden' : ''; }
    });
    updateHint();
    updateRunButton();
  }

  // ── Phase 対称性行の構築 ─────────────────────────────────────────────────────
  function buildPhaseRows() {
    const container = document.getElementById('phase-rows');
    container.innerHTML = '';

    if (_phases.length === 0) {
      container.innerHTML = '<div class="nth-hint">Phase 情報が見つかりません</div>';
      return;
    }

    _phases.forEach(ph => {
      const row = document.createElement('div');
      row.className = 'phase-row';

      const label = document.createElement('div');
      label.className = 'phase-label';
      label.textContent = `Phase ${ph.index}  —  ${ph.name}`;
      label.title = ph.name;

      const sel = document.createElement('select');
      sel.className = 'sym-select';
      sel.id = `sym-${ph.index}`;
      SYM_OPTIONS.forEach(([val, text]) => {
        const opt = document.createElement('option');
        opt.value = val;
        opt.textContent = text;
        sel.appendChild(opt);
      });

      row.appendChild(label);
      row.appendChild(sel);
      container.appendChild(row);
    });
  }

  // ── ヒント更新 ───────────────────────────────────────────────────────────────
  function updateHint() {
    const total   = document.querySelectorAll('.nth-check:not(:disabled)').length;
    const checked = document.querySelectorAll('.nth-check:not(:disabled):checked').length;
    document.getElementById('nth-hint').textContent =
      total > 0 ? `${checked} / ${total} 選択中` : '';
  }

  // ── 実行ボタン ───────────────────────────────────────────────────────────────
  function updateRunButton() {
    const hasRef     = !!document.querySelector('input[name="stage-role"]:checked');
    const hasChecked = !!document.querySelector('.nth-check:not(:disabled):checked');
    document.getElementById('btn-run').disabled =
      !(_parentFolder && hasRef && hasChecked && _phases.length > 0 && !_running);
  }

  // ── 実行 ─────────────────────────────────────────────────────────────────────
  async function onRun() {
    const refRadio = document.querySelector('input[name="stage-role"]:checked');
    if (!refRadio || !_parentFolder) return;
    const refStageName = refRadio.value;

    // ref 行の tif 選択値を取得
    const refRow    = document.getElementById(`nth-row-${_sid(refStageName)}`);
    const refTifSel = refRow ? refRow.querySelector('.tif-select') : null;
    const refTif    = refTifSel ? refTifSel.value : refStageName;

    const checkedNames = Array.from(
      document.querySelectorAll('.nth-check:not(:disabled):checked')
    ).map(cb => cb.value);
    if (checkedNames.length === 0) return;

    // nth ごとのオーバーライドを収集
    const nthMatOverrides  = {};
    const nthTifOverrides  = {};
    const nthXlsxOverrides = {};
    checkedNames.forEach(name => {
      const row     = document.getElementById(`nth-row-${_sid(name)}`);
      if (!row) return;
      const matSel  = row.querySelector('.mat-select');
      const tifSel  = row.querySelector('.tif-select');
      const xlsxSel = row.querySelector('.xlsx-select');
      if (matSel  && matSel.value  && matSel.value  !== name) nthMatOverrides[name]  = matSel.value;
      if (tifSel  && tifSel.value  && tifSel.value  !== name) nthTifOverrides[name]  = tifSel.value;
      if (xlsxSel && xlsxSel.value && xlsxSel.value !== name) nthXlsxOverrides[name] = xlsxSel.value;
    });

    const phaseSym = {};
    _phases.forEach(ph => {
      const sel = document.getElementById(`sym-${ph.index}`);
      phaseSym[String(ph.index)] = sel ? sel.value : 'cubic';
    });

    _running = true;
    document.getElementById('btn-run').disabled = true;
    setStatus('解析を開始しています...', true);

    const params = {
      parent_folder:      _parentFolder,
      ref_name:           refStageName,
      ref_tif:            refTif,
      nth_names:          checkedNames,
      nth_mat_overrides:  nthMatOverrides,
      nth_folder_names:   nthTifOverrides,
      nth_xlsx_overrides: nthXlsxOverrides,
      angle_threshold:    parseFloat(document.getElementById('angle-thr').value) || 5.0,
      scale_factor:       parseFloat(document.getElementById('scale-factor').value) || 100.0,
      phase_sym:          phaseSym,
    };

    await eel.patrep_start_batch(params)();
  }

  // ── Python コールバック ───────────────────────────────────────────────────────
  eel.expose(patrep_on_nth_status);
  function patrep_on_nth_status(name, type) {
    const sid = _sid(name);
    const row = document.getElementById(`nth-row-${sid}`);
    if (row) {
      row.className = 'stage-row ' + (type === 'idle' ? '' : type);
    }
  }

  eel.expose(patrep_on_complete);
  function patrep_on_complete(success, msg) {
    _running = false;
    setStatus(msg, success);
    updateRunButton();
  }

  // ── ユーティリティ ────────────────────────────────────────────────────────────
  function setStatus(msg, ok) {
    const el = document.getElementById('footer-status');
    el.textContent = msg;
    el.className = 'footer-status ' + (ok ? 'ok' : 'err');
  }

  function _sid(s) {
    return s.replace(/[^a-zA-Z0-9\-]/g, '_');
  }

  window.addEventListener('load', async () => {
    const wd = await eel.get_work_dir()();
    if (wd) window._workDir = wd;
  });
</script>
</body>
</html>
